model_list:
  - model_name: db-openai-endpoint
    litellm_params:
      model: openai/*
      api_base: https://exampleopenaiendpoint-production-0ee2.up.railway.app/
  - model_name: bedrock/*
    litellm_params:
      model: bedrock/*
  - model_name: openai/*
    litellm_params:
      model: openai/*
  - model_name: gemini/*
    litellm_params:
      model: gemini/*

litellm_settings:
  callbacks: ["cloudzero"]
  default_internal_user_params:
    user_role: "proxy_admin"  # Give new SSO users admin access
